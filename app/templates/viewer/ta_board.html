<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TA view</title>
<style>
  /* ===== カラールール（指示）=====
     背景=黒 / 基本文字=白 / L1=青 L2=緑 L3=黄 L4=赤 L5=白(灰)
     ハイライト = 文字色と背景を反転 */
  :root{
    --bg:#000; --fg:#fff; --dim:#8a8a90; --line:#1c1c1e; --panel:#0b0b0c;
    --l1:#2d9bf0; --l2:#32d74b; --l3:#ffd60a; --l4:#ff453a; --l5:#c9c9ce;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--fg);
    font-family:"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{display:flex;height:100vh;width:100vw}

  /* ===== 左：履歴一覧（最大1000）===== */
  #side{width:9.5vw;min-width:150px;max-width:230px;height:100vh;
    border-right:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #side .shd{padding:1.2vh 1vw;border-bottom:1px solid var(--line);
    font-size:1.8vh;font-weight:700;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline}
  #side .shd b{color:var(--fg)}
  #hist{flex:1;overflow-y:auto;overflow-x:hidden}
  #hist::-webkit-scrollbar{width:8px}#hist::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}
  .hi{padding:1.1vh 1vw;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:baseline;gap:.5vw;line-height:1.2}
  .hi:hover{background:#141416}
  .hi .no{font-size:2.0vh;font-weight:800;min-width:3.2em}
  .hi .mt{font-size:1.4vh;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hi .md{font-size:1.25vh;color:var(--dim);font-weight:700}
  .hi.active{background:var(--fg);color:var(--bg)}              /* ハイライト=反転 */
  .hi.active .mt,.hi.active .md{color:var(--bg)}
  #live{padding:.9vh 1vw;border-top:1px solid var(--line);font-size:1.4vh;font-weight:800;color:var(--dim);
    display:flex;align-items:center;gap:.5vw}
  #live .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:#3a3a3e}
  #live.on .dot{background:var(--l2);box-shadow:0 0 10px var(--l2)}

  /* ===== 右：1集計を大きく（本物テーブルを注入）===== */
  /* 右側はウインドウ高さいっぱいに。ヘッダ固定・テーブルが残り高さを埋める */
  #main{flex:1;height:100vh;overflow:hidden;padding:1.1vh 1vw;min-width:0;
    display:flex;flex-direction:column}

  .ta-head{flex:0 0 auto;display:flex;align-items:baseline;gap:1.2vw;border-bottom:2px solid var(--line);
    padding-bottom:.6vh;margin-bottom:.7vh}
  .ta-head .rid{font-size:5vh;font-weight:900;letter-spacing:-.01em}
  .ta-head .meta{font-size:2.2vh;color:var(--dim);font-weight:700}
  .ta-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:3vh}

  /* ===== 本物テーブル（/admin/timing/results と同一構造）を黒背景用に配色 ===== */
  .tr-wrap{flex:1 1 auto;min-height:0;overflow:auto}
  .tr-wrap::-webkit-scrollbar{width:9px;height:9px}.tr-wrap::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}
  /* height:100% で余った縦幅を各行に自動配分＝ウインドウ高さに合わせて行が伸縮 */
  .tr-table{width:100%;height:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .tr-table thead tr{height:4.5vh}  /* ヘッダは固定高。残りをtbodyが埋める */
  .tr-table th{padding:.35vh .4vw;text-align:center;font-size:1.35vh;font-weight:800;
    color:var(--dim);letter-spacing:.5px;white-space:nowrap}
  .tr-table thead tr.g-row th{border-bottom:1px solid var(--line);color:var(--dim)}
  .tr-table th.gsep,.tr-table td.gsep{border-left:2px solid #35353a}
  .tr-table thead tr.h-row th{border-bottom:2px solid var(--line)}
  /* ⚠ td にはフォントサイズを指定しない（各列の .c-xxx が効かなくなるため） */
  .tr-table td{padding:.45vh .4vw;border-bottom:1px solid var(--line);white-space:nowrap;
    text-align:right}
  .tr-table tr.race-start td{border-top:2px solid #45454b}
  .tr-table tr.lane-start td{border-top:2px solid #2a2a2e}

  /* LANE：セルをレーン色で塗り黒文字（指示：L1青 L2緑 L3黄 L4赤 L5白/灰） */
  /* LANE：POSと同じ幅・文字サイズは倍 */
  .c-lane{text-align:center;vertical-align:middle;width:4.5vw;font-size:4.8vh;font-weight:900;color:#000}
  .tr-table td.lane-1{background:var(--l1);color:#000}
  .tr-table td.lane-2{background:var(--l2);color:#000}
  .tr-table td.lane-3{background:var(--l3);color:#000}
  .tr-table td.lane-4{background:var(--l4);color:#000}
  .tr-table td.lane-5{background:var(--l5);color:#000}

  .c-pos{text-align:center;vertical-align:middle;font-size:2.8vh;font-weight:900;width:4.5vw}
  .rflag{display:block;margin-top:2px;font-size:1.15vh;font-weight:900;line-height:1.25;border-radius:5px;padding:0 3px;white-space:nowrap}
  .rflag-dnf{background:#6b6b70;color:#fff}
  .rflag-js{background:var(--l4);color:#fff}

  /* TOTAL TIME：4倍（ヒーロー数値） */
  .c-total{text-align:right;font-weight:900;vertical-align:middle;font-size:12vh;letter-spacing:-.02em;padding-right:.8vw}
  .c-gap{text-align:right;vertical-align:middle;font-size:2.7vh;color:#c6a4ff}
  .c-totav{text-align:right;vertical-align:middle;font-size:2.7vh;color:#5fd0c4}
  .c-max{text-align:right;vertical-align:middle;font-size:2.7vh;color:var(--l4)}
  .unit{color:#6a6a70;font-size:1.2vh;margin-left:1px}

  .c-lapno{text-align:center;color:var(--dim);font-size:2.1vh;width:2vw}
  .c-lapt{text-align:right;font-weight:800;font-size:2.7vh}
  .c-lapav{text-align:right;color:#9fb0bf;font-size:2.2vh}

  .c-sec{text-align:right;background:#0e0e10;border-left:1px solid var(--line);line-height:1.15;font-size:2.3vh}
  .c-sec.sg{background:#13171d}
  .c-sec .sec-t{font-weight:800}
  .c-sec .sec-v{color:var(--dim);font-size:1.75vh}

  /* ハイライト＝反転（その日の上位3傑。1位=白地黒字／2・3位=灰地黒字で段階） */
  .r1{background:#fff !important;color:#000 !important;font-weight:900;border-radius:3px}
  .r2{background:#c9c9ce !important;color:#000 !important;font-weight:900;border-radius:3px}
  .r3{background:#86868b !important;color:#000 !important;font-weight:900;border-radius:3px}
  .c-sec .r1,.c-sec .r2,.c-sec .r3{display:block;padding:0 2px}

  /* ===== 当日ベスト行（最下部）===== */
  .best-row td{border-top:4px solid #55555c;background:#101014;vertical-align:middle}
  .best-row .best-lane{background:#1a1a1d;color:var(--l3);font-size:3.2vh;font-weight:900}
  .best-row .best-pos{white-space:normal;line-height:1.1;font-size:1.7vh;font-weight:800;color:var(--dim)}
  .best-row .c-total{font-size:5vh;font-weight:900;color:var(--fg)}
  .best-row .tb-v{font-weight:900}
  .tb-dash{color:#55555a}
  #ta-exit{display:none}   /* desktopでは非表示。スマホのみ下部に表示 */

  /* ===== スマホ縦画面（/api/ta など）。FHDの横2カラム＆vhフォントを上書き ===== */
  @media (max-width: 860px){
    /* ページ全体を自然に流す（固定100vh+overflow:hiddenの切れを解除）。
       内容(main)は全レーンを切らずに全部表示し、スクロールするのは履歴側。 */
    html,body{height:auto;overflow:auto}
    .wrap{flex-direction:column;height:auto;min-height:100dvh}
    /* 内容を上・自然高さで全部表示（縦は切らない／横だけ必要ならスクロール） */
    #main{order:1;height:auto;flex:none;overflow-x:auto;overflow-y:visible;display:block;padding:3vw 2.5vw}
    /* 履歴は内容の下。高さ上限付きの“スクロール箱”にする（＝ここが唯一スクロールする側） */
    #side{order:2;width:100%;max-width:none;min-width:0;height:auto;max-height:42vh;
      overflow-y:auto;overflow-x:hidden;border-right:none;border-top:2px solid var(--line)}
    #side .shd{display:flex;padding:2.6vw 4vw;font-size:3.4vw;position:sticky;top:0;background:var(--panel);z-index:1}
    #hist{display:block;overflow:visible}
    .hi{display:flex;align-items:baseline;gap:3vw;border-right:none;
      border-bottom:1px solid var(--line);padding:3.2vw 4vw}
    .hi .no{font-size:5vw;min-width:3.6em}
    .hi .mt{display:inline;font-size:3.6vw}
    .hi:nth-child(n+11){display:none}     /* 直近10件のみ表示 */
    #live{display:none}
    /* 戻るボタン（最下部） */
    #ta-exit{order:3;display:block;text-align:center;padding:3.8vw;font-size:4.2vw;
      font-weight:800;color:var(--fg);text-decoration:none;
      background:var(--panel);border-top:2px solid var(--line)}
    #ta-exit:active{background:#141416}
    .ta-head{flex-wrap:wrap;padding-bottom:1.5vw;margin-bottom:1.5vw}
    .ta-head .rid{font-size:8.5vw}
    .ta-head .meta{font-size:3.6vw}
    .tr-wrap{flex:none;overflow:auto}
    .tr-table{height:auto}
    .tr-table thead tr{height:auto}
    .tr-table th{font-size:2.6vw;padding:1vw 1.2vw}
    .tr-table td{padding:1.4vw 1.4vw}
    .c-lane{font-size:7.5vw;width:13vw}
    .c-pos{font-size:5.2vw;width:11vw}
    .c-total{font-size:9.5vw;padding-right:2vw}
    .c-gap{font-size:3.6vw}.c-totav{font-size:3.6vw}.c-max{font-size:3.6vw}
    .c-lapno{font-size:3vw}
    .c-lapt{font-size:4vw}
    .c-lapav{font-size:3vw}
    .c-sec{font-size:3.4vw}
    .c-sec .sec-v{font-size:2.7vw}
    .unit{font-size:2.2vw}
    .rflag{font-size:2.4vw}
    .best-row .best-lane{font-size:6vw}
    .best-row .best-pos{font-size:2.8vw}
    .best-row .c-total{font-size:6.5vw}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside id="side">
    <div class="shd"><span>履歴</span><span><b id="hcount">0</b> 件</span></div>
    <div id="hist"></div>
    <div id="live"><span class="dot"></span><span id="livetxt">接続中…</span></div>
  </aside>
  <section id="main"><div class="ta-empty">読み込み中…</div></section>
  <a id="ta-exit" href="javascript:history.back()">← 観覧に戻る</a>
</div>
<script>
(function(){
  "use strict";
  var BASE = location.pathname.replace(/\/+$/,"");   // /view/ta or /<slug>/view/ta
  var QS   = location.search || "";
  function fmtClock(iso){ if(!iso)return ""; var t=String(iso).replace("T"," ");
    var m=t.match(/(\d{2})-(\d{2})\D+(\d{2}):(\d{2})/); return m?(m[1]+"/"+m[2]+" "+m[3]+":"+m[4]):t; }
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }

  var current=null, pinnedByUser=false, hist=[];

  function renderHist(){
    var box=document.getElementById("hist"); box.innerHTML="";
    document.getElementById("hcount").textContent=hist.length;
    hist.forEach(function(r){
      var row=el("div","hi"+(r.race_id===current?" active":""));
      row.appendChild(el("span","no","#"+r.race_id));
      row.appendChild(el("span","mt",(r.heat_tag!=null?("ヒート"+r.heat_tag+" "):"")+fmtClock(r.created_at)));
      row.onclick=function(){ pinnedByUser=true; show(r.race_id); };
      box.appendChild(row);
    });
  }
  function loadList(cb){
    fetch(BASE+"/list"+QS,{cache:"no-store"}).then(function(x){return x.json();}).then(function(j){
      hist=(j&&j.races)||[]; renderHist(); if(cb)cb();
    }).catch(function(){});
  }

  function show(raceId){
    if(raceId==null)return;
    fetch(BASE+"/race/"+raceId+"/table"+QS,{cache:"no-store"}).then(function(x){return x.text();}).then(function(html){
      current=raceId; renderHist();
      document.getElementById("main").innerHTML=html;
      var act=document.querySelector("#hist .hi.active");
      if(act&&act.scrollIntoViewIfNeeded) act.scrollIntoViewIfNeeded();
    }).catch(function(){});
  }

  function refreshToLatest(){
    loadList(function(){ if(!hist.length)return; if(!pinnedByUser||current==null){ show(hist[0].race_id); } });
  }

  var live=document.getElementById("live"), liveTxt=document.getElementById("livetxt");
  var pollTimer=null;
  function setLive(on){ live.classList.toggle("on",on); liveTxt.textContent=on?"自動更新 中":"ポーリング"; }
  function startPoll(){ if(pollTimer)return; pollTimer=setInterval(refreshToLatest,10000); }
  var sseReady=false;
  function startSSE(){
    try{
      var es=new EventSource(BASE+"/events"+QS);
      es.addEventListener("ready",function(){ sseReady=true; setLive(true); });
      es.addEventListener("ta",function(){ sseReady=true; setLive(true); refreshToLatest(); });
      es.onmessage=function(){ refreshToLatest(); };
      es.onerror=function(){ setLive(false); startPoll(); };
      // 6秒以内に ready が来なければ（nginxバッファ等でSSEが届かない）ポーリング表示に切替
      setTimeout(function(){ if(!sseReady){ setLive(false); startPoll(); } }, 6000);
    }catch(e){ setLive(false); startPoll(); }
  }
  refreshToLatest(); startSSE(); startPoll();
})();
</script>
</body>
</html>
