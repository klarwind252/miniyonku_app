<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>TA view</title>
<style>
  /* ===== カラールール（指示）=====
     背景=黒 / 基本文字=白 / L1=青 L2=緑 L3=黄 L4=赤 L5=白(灰)
     ハイライト = 文字色と背景を反転 */
  :root{
    --bg:#000; --fg:#fff; --dim:#8a8a90; --line:#1c1c1e; --panel:#0b0b0c;
    --l1:#2d9bf0; --l2:#32d74b; --l3:#ffd60a; --l4:#ff453a; --l5:#c9c9ce;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--fg);
    font-family:"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{display:flex;height:100vh;width:100vw}

  /* ===== 左：履歴一覧（最大1000）===== */
  #side{width:17vw;min-width:220px;max-width:360px;height:100vh;
    border-right:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #side .shd{padding:1.3vh 1vw;border-bottom:1px solid var(--line);
    font-size:1.9vh;font-weight:700;letter-spacing:.04em;color:var(--dim);
    display:flex;justify-content:space-between;align-items:baseline}
  #side .shd b{color:var(--fg)}
  #hist{flex:1;overflow-y:auto;overflow-x:hidden}
  #hist::-webkit-scrollbar{width:8px}#hist::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}
  .hi{padding:1.15vh 1vw;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;align-items:baseline;gap:.5vw;line-height:1.2}
  .hi:hover{background:#141416}
  .hi .no{font-size:2.1vh;font-weight:800;min-width:3.2em}
  .hi .mt{font-size:1.45vh;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hi .md{font-size:1.3vh;color:var(--dim);font-weight:700}
  .hi.active{background:var(--fg);color:var(--bg)}              /* ハイライト=反転 */
  .hi.active .mt,.hi.active .md{color:var(--bg)}

  /* ===== 右：1集計を大きく ===== */
  #main{flex:1;height:100vh;display:flex;flex-direction:column;padding:1.8vh 1.8vw;min-width:0}
  #head{display:flex;align-items:baseline;gap:1.2vw;flex:0 0 auto;
    border-bottom:2px solid var(--line);padding-bottom:1.1vh;margin-bottom:1.1vh}
  #head .rid{font-size:5.4vh;font-weight:900;letter-spacing:-.01em}
  #head .meta{font-size:2.3vh;color:var(--dim);font-weight:700}
  #head .live{margin-left:auto;font-size:1.7vh;font-weight:800;color:var(--dim);display:flex;align-items:center;gap:.5vw}
  #head .live .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:#3a3a3e}
  #head .live.on .dot{background:var(--l2);box-shadow:0 0 10px var(--l2)}

  #scroll{flex:1;overflow:auto;min-height:0}
  #scroll::-webkit-scrollbar{width:9px}#scroll::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}

  /* 見出し */
  .sect{font-size:1.9vh;font-weight:800;letter-spacing:.06em;color:var(--dim);margin:1.2vh 0 .8vh}

  /* 順位表（詳細ページの「順位」＝順位/スタートレーン/合計タイム/ベストラップ） */
  table.rk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.rk th{font-size:1.6vh;color:var(--dim);font-weight:800;text-align:right;padding:.5vh .8vw;border-bottom:1px solid var(--line)}
  table.rk th:first-child,table.rk th:nth-child(2){text-align:left}
  table.rk td{padding:1.0vh .8vw;border-bottom:1px solid var(--line);font-size:2.6vh;text-align:right}
  table.rk td.pos{text-align:center;font-size:3.4vh;font-weight:900;width:2.4em}
  table.rk td.lane{text-align:left;font-size:2.4vh;font-weight:800}
  table.rk td.big{font-size:3.4vh;font-weight:900;letter-spacing:-.01em}
  .flag{display:inline-block;margin-left:.5vw;font-size:1.5vh;font-weight:900;padding:.05em .5em;border-radius:6px;vertical-align:middle}
  .flag.dnf{background:#6b6b70;color:#fff}.flag.js{background:var(--l4);color:#fff}.flag.warn{background:var(--l3);color:#000}
  tr.r1 td{background:var(--fg);color:#000}                      /* 1位=反転ハイライト */
  tr.r1 td.lane.l1,tr.r1 td.lane.l2,tr.r1 td.lane.l3,tr.r1 td.lane.l4,tr.r1 td.lane.l5{color:#000}

  /* 各レーンのラップ詳細（詳細ページ：ラップ/タイム/セクター）をレーン別カードで横並び */
  #lanes{display:flex;gap:1.4vw;flex-wrap:wrap;align-items:flex-start}
  .lcard{flex:1 1 30%;min-width:26vw;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .lcard .lh{padding:.9vh 1vw;font-size:2.2vh;font-weight:900;display:flex;align-items:baseline;gap:.6vw}
  .lcard .lh .sub{font-size:1.5vh;font-weight:700;opacity:.85}
  table.lp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.lp th{font-size:1.4vh;color:var(--dim);font-weight:800;text-align:right;padding:.5vh .8vw;border-bottom:1px solid var(--line)}
  table.lp th:first-child{text-align:left}
  table.lp td{padding:.7vh .8vw;border-bottom:1px solid var(--line);font-size:1.95vh;text-align:right;white-space:nowrap}
  table.lp td.lapno{text-align:left;font-weight:800;color:var(--dim)}
  table.lp td.sec{text-align:left;font-size:1.5vh;color:var(--dim);white-space:normal}
  table.lp td.tm.best{background:var(--fg);color:#000;font-weight:900}   /* ベストラップ=反転 */

  .l1{color:var(--l1)}.l2{color:var(--l2)}.l3{color:var(--l3)}.l4{color:var(--l4)}.l5{color:var(--l5)}
  .bd1{border-color:var(--l1)}.bd2{border-color:var(--l2)}.bd3{border-color:var(--l3)}.bd4{border-color:var(--l4)}.bd5{border-color:var(--l5)}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:3vh}
</style>
</head>
<body>
<div class="wrap">
  <aside id="side">
    <div class="shd"><span>履歴</span><span><b id="hcount">0</b> 件</span></div>
    <div id="hist"></div>
  </aside>
  <section id="main">
    <div id="head">
      <div class="rid" id="h-rid">—</div>
      <div class="meta" id="h-meta"></div>
      <div class="live" id="h-live"><span class="dot"></span><span id="h-livetxt">接続中…</span></div>
    </div>
    <div id="scroll">
      <div class="sect">順位</div>
      <table class="rk"><thead><tr>
        <th>順位</th><th>スタートレーン</th><th>合計タイム</th><th>ベストラップ</th>
      </tr></thead><tbody id="rankbody"></tbody></table>
      <div class="sect">各レーンのラップ詳細</div>
      <div id="lanes"></div>
    </div>
    <div id="empty" style="display:none">結果がありません</div>
  </section>
</div>
<script>
(function(){
  "use strict";
  var BASE = location.pathname.replace(/\/+$/,"");   // /view/ta or /<slug>/view/ta
  var QS   = location.search || "";
  function fmt(s){ return (s==null)?"—":s.toFixed(3); }
  function medal(p){ return p===1?"🏆":p===2?"🥈":p===3?"🥉":String(p); }
  function lc(l){ return (l>=1&&l<=5)? l : 5; }
  function fmtClock(iso){ if(!iso)return ""; var t=String(iso).replace("T"," ");
    var m=t.match(/(\d{2})-(\d{2})\D+(\d{2}):(\d{2})/); return m?(m[1]+"/"+m[2]+" "+m[3]+":"+m[4]):t; }
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }

  var current=null, pinnedByUser=false, hist=[];

  function renderHist(){
    var box=document.getElementById("hist"); box.innerHTML="";
    document.getElementById("hcount").textContent=hist.length;
    hist.forEach(function(r){
      var row=el("div","hi"+(r.race_id===current?" active":""));
      row.appendChild(el("span","no","#"+r.race_id));
      var label=(r.heat_tag!=null?("ヒート"+r.heat_tag+" "):"")+fmtClock(r.created_at);
      row.appendChild(el("span","mt",label));
      row.appendChild(el("span","md",(r.mode==="race"?"RACE":"FREE")+(r.target_laps!=null?(" "+r.target_laps+"L"):"")));
      row.onclick=function(){ pinnedByUser=true; show(r.race_id); };
      box.appendChild(row);
    });
  }
  function loadList(cb){
    fetch(BASE+"/list"+QS,{cache:"no-store"}).then(function(x){return x.json();}).then(function(j){
      hist=(j&&j.races)||[]; renderHist(); if(cb)cb();
    }).catch(function(){});
  }

  function show(raceId){
    if(raceId==null)return;
    fetch(BASE+"/race/"+raceId+QS,{cache:"no-store"}).then(function(x){return x.json();}).then(function(d){
      current=d.race_id; renderHist();
      document.getElementById("h-rid").textContent="#"+d.race_id;
      var meta=(d.mode==="f1"||d.mode==="race"?"レース（反応込み）":"フリー")
        +(d.target_laps!=null?("　/　"+d.target_laps+"周"):"")
        +(d.heat_tag!=null?("　/　ヒート"+d.heat_tag):"")
        +(d.created_at?("　/　"+fmtClock(d.created_at)):"");
      document.getElementById("h-meta").textContent=meta;

      var scroll=document.getElementById("scroll"), empty=document.getElementById("empty");
      var rb=document.getElementById("rankbody"), lanes=document.getElementById("lanes");
      rb.innerHTML=""; lanes.innerHTML="";
      if(!d.has_result||!d.ranking||!d.ranking.length){ scroll.style.display="none"; empty.style.display="flex"; return; }
      scroll.style.display="block"; empty.style.display="none";

      // 順位（順位/スタートレーン/合計タイム/ベストラップ）＋DNF/JS/⚠
      d.ranking.forEach(function(m){
        var c=lc(m.start_lane);
        var tr=el("tr",(m.pos===1?"r1":""));
        tr.appendChild(el("td","pos", medal(m.pos)));
        var tdl=el("td","lane l"+c); tdl.appendChild(document.createTextNode(m.start_lane+"コース スタート"));
        if(m.dnf){ var f=el("span","flag dnf","DNF"); tdl.appendChild(f); }
        if(m.jump_start){ tdl.appendChild(el("span","flag js","JS")); }
        if(m.missing){ tdl.appendChild(el("span","flag warn","⚠要確認")); }
        tr.appendChild(tdl);
        tr.appendChild(el("td","big", m.total_s!=null?(fmt(m.total_s)+" 秒"):"—"));
        tr.appendChild(el("td", m.best_s!=null?(fmt(m.best_s)+" 秒"):"—"));
        rb.appendChild(tr);
      });

      // 各レーンのラップ詳細（ラップ/タイム/セクター）
      d.machines.forEach(function(mc){
        var c=lc(mc.start_lane);
        var card=el("div","lcard bd"+c);
        var h=el("div","lh l"+c); h.appendChild(document.createTextNode(mc.start_lane+"コース スタート"));
        var sub=el("span","sub", "（"+(mc.completed_laps||0)+"周完了"+(mc.total_s!=null?("・合計 "+fmt(mc.total_s)+"秒"):"")+"）");
        h.appendChild(sub); card.appendChild(h);
        var tbl=el("table","lp");
        var thead=el("thead"), htr=el("tr");
        htr.appendChild(el("th",null,"ラップ")); htr.appendChild(el("th",null,"タイム")); htr.appendChild(el("th",null,"セクター"));
        thead.appendChild(htr); tbl.appendChild(thead);
        var tb=el("tbody");
        var best=null; mc.laps.forEach(function(lp){ if(best==null||lp.lap_s<best)best=lp.lap_s; });
        mc.laps.forEach(function(lp){
          var tr=el("tr");
          tr.appendChild(el("td","lapno", lp.lap+"周目"));
          tr.appendChild(el("td","tm"+((best!=null&&Math.abs(lp.lap_s-best)<1e-6)?" best":""), fmt(lp.lap_s)+" 秒"));
          var sc=(lp.sectors||[]).map(function(s){ return "["+s.from+"→"+s.to+"] "+fmt(s.s); }).join(" / ");
          tr.appendChild(el("td","sec", sc||"—"));
          tb.appendChild(tr);
        });
        tbl.appendChild(tb); card.appendChild(tbl); lanes.appendChild(card);
      });

      var act=document.querySelector("#hist .hi.active");
      if(act&&act.scrollIntoViewIfNeeded) act.scrollIntoViewIfNeeded();
    }).catch(function(){});
  }

  function refreshToLatest(){
    loadList(function(){ if(!hist.length)return; if(!pinnedByUser||current==null){ show(hist[0].race_id); } });
  }

  var live=document.getElementById("h-live"), liveTxt=document.getElementById("h-livetxt");
  var pollTimer=null;
  function setLive(on){ live.classList.toggle("on",on); liveTxt.textContent=on?"自動更新 中":"ポーリング"; }
  function startPoll(){ if(pollTimer)return; pollTimer=setInterval(refreshToLatest,10000); }
  function startSSE(){
    try{
      var es=new EventSource(BASE+"/events"+QS);
      es.addEventListener("ready",function(){ setLive(true); });
      es.addEventListener("ta",function(){ setLive(true); refreshToLatest(); });
      es.onmessage=function(){ refreshToLatest(); };
      es.onerror=function(){ setLive(false); startPoll(); };
    }catch(e){ setLive(false); startPoll(); }
  }
  refreshToLatest(); startSSE(); startPoll();
})();
</script>
</body>
</html>
