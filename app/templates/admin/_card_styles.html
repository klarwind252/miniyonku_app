{# ========================================================================
   結果入力カード 共通スタイル（単一ソース）
   即決勝 admin/bracket.html と 予選ヒート admin/heat_tournament.html が
   どちらも {% include "admin/_card_styles.html" %} する。
   ★カードの見た目を変える時は「このファイルだけ」を直せば両方に反映される。
   ★各テンプレートの <style> より後に include されるため、ここの値が常に優先
     （片方だけ値がズレる＝ドリフトを構造的に防止）。
   ======================================================================== #}
<style>
/* カード枠 */
.bracket-group{ background:#fff; border:2px solid #dee2e6; border-radius:10px; padding:8px 16px; margin-bottom:6px; }
.bracket-group.done{ border-color:#27ae60; }
/* 決勝/3位の枠色：即決勝は final-group/third-group、ヒートは is-final/is-third の2系統に両対応 */
.bracket-group.final-group, .bracket-group.is-final{ border-color:#d4a017; background:#fffde7; }
.bracket-group.third-group, .bracket-group.is-third{ border-color:#7f8c8d; background:#f8f9fa; }
.bracket-group.final-group .slot-row, .bracket-group.is-final .slot-row{ flex-wrap:nowrap; }

/* 行 */
.slot-row{ display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid #f0f0f0; flex-wrap:wrap; user-select:none; -webkit-user-select:none; }
.slot-row:last-child{ border-bottom:none; }
.bracket-group.lane-sortable .slot-row{ border-radius:6px; }
.slot-row.lane-dragging{ opacity:.55; background:#eef5ff; box-shadow:0 2px 8px rgba(10,132,255,.25); }
.bracket-group.lane-sortable.lane-drop-active{ outline:2px dashed #0a84ff; outline-offset:2px; }
.slot-row.lane-drop-hover{ outline:2px dashed #0a84ff; outline-offset:-2px; background:#eef5ff; }

/* レーン番号（レーン色の四角＝base.html の .slot-row[data-lane] が着色。並び替え可能行は掴み口） */
.lane-no-card{ flex-shrink:0; font-size:13px; font-weight:bold; color:#b0b7bf; margin:0; padding:0; }
.lane-no-card.lane-handle{ cursor:grab; touch-action:none; color:#6b7681; background:#eef1f4; border-radius:5px; min-width:1.6em; text-align:center; padding:2px 5px; }
.lane-no-card.lane-handle:active{ cursor:grabbing; background:#e2e6ea; }

/* 空きレーン（2名の組で未使用のコース。ここへドラッグで 1・3 / 2・3 を選べる） */
.slot-row.slot-empty{ background:#fafbfc; border:1px dashed #e1e6ea; border-radius:6px; }
.slot-row.slot-empty .slot-name{ color:#c4cace; font-style:italic; font-weight:normal; font-size:13px; }

/* 順位/COバッジ */
.rank-badge{ display:inline-flex; align-items:center; justify-content:center; width:30px; min-width:30px; max-width:30px; height:26px; padding:0; box-sizing:border-box; border-radius:13px; line-height:1; font-size:14px; font-weight:bold; flex-shrink:0; border:2px solid transparent; }
.rank-badge.r1{ background:#fcf3cf; color:#7d6608; border-color:#d4a017; }
.rank-badge.r2{ background:#eef1f4; color:#4a5057; border-color:#a4b0be; }
.rank-badge.r3{ background:#f6e3d0; color:#6e4b1f; border-color:#c68642; }
.rank-badge.rn{ background:#f4f6f7; color:#7f8c8d; border-color:#dfe4ea; }
.rank-badge.co{ background:#fdecea; color:#c0392b; border-color:#e74c3c; font-size:11px; }
.rank-badge.ph{ visibility:hidden; }

/* レーサー名 */
.slot-name{ font-weight:bold; font-size:18px; flex:1; min-width:4.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot-name .seed-badge{ display:block; margin-left:0; margin-top:1px; width:fit-content; }

/* ラップタイマー反映の合計タイム（1/2/3位の薄色） */
.slot-time{ font-size:16px; font-weight:bold; color:#2c3e50; font-variant-numeric:tabular-nums; text-align:right; margin-right:8px; white-space:nowrap; }
.slot-time.t1{ background:#f3e8ff; color:#6b21a8 !important; border-radius:4px; padding:1px 7px; }
.slot-time.t2{ background:#dbeafe; color:#1e40af !important; border-radius:4px; padding:1px 7px; }
.slot-time.t3{ background:#dcfce7; color:#166534 !important; border-radius:4px; padding:1px 7px; }

/* 勝者○ボタン / 順位プルダウン */
.win-btn{ width:40px; height:40px; border:2px solid #dee2e6; border-radius:6px; cursor:pointer; font-size:20px; font-weight:bold; background:#fff; transition:all .12s; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.win-btn.sel{ border-color:#27ae60; background:#eafaf1; color:#27ae60; }
.rank-select{ padding:5px 8px; border:1px solid #ced4da; border-radius:6px; font-size:13px; background:#fff; }
</style>
