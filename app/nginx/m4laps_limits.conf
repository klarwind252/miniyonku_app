# ============================================================================
# M4LAPS セキュリティ強化 その2 : POSTボディ上限 ＋ 低速接続タイムアウト
# 配置先: /etc/nginx/conf.d/m4laps_limits.conf  （http コンテキストに読み込まれる）
#
# 目的:
#   - 巨大POSTによるメモリ/帯域の消耗を抑える（画像アップロードは許容）。
#   - Slowloris 等「だらだら接続でワーカーを占有する」攻撃を緩和する。
#
# 会場WiFi(NAT・多人数同一IP)でも参加者を巻き込みません
#   （IP単位のリクエスト数制限ではなく、1接続あたりの上限/タイムアウトのため）。
#
# ロールバック: このファイルを削除して `sudo nginx -t && sudo systemctl reload nginx`。
# ============================================================================

# 1) リクエストボディ上限。
#    レース情報の画像（長辺667pxにリサイズ・base64格納、最大 4枚×3種）を十分許容しつつ、
#    数十MB級の巨大POSTは 413 で弾く。実運用の最大でも数MB程度のため 25m は余裕。
#    ※ 既存の server/location に個別設定があればそちらが優先されます（壊しません）。
client_max_body_size 25m;

# 2) 低速クライアント対策（インアクティブ＝無通信が続いたら切る）。
#    - ヘッダ送信が20秒来なければ切断。
#    - ボディ受信は60秒の無通信で切断（モバイルの画像アップロードにも十分な猶予）。
#    ※ send_timeout（応答送信側）は SSE(20秒ごとのping)への影響を避けるため設定しない
#      （nginx既定60s＞ping間隔20s で問題なし。別途 proxy_read_timeout 3600s も設定済み）。
client_header_timeout 20s;
client_body_timeout   60s;

# 3) 大きめのヘッダ/Cookie を許容（店舗別Cookie等で 400 を出さないための余裕）。
large_client_header_buffers 4 16k;
