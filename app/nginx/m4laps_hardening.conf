# ============================================================================
# M4LAPS セキュリティ強化 その1 : nginx バージョン露出の抑止
# 配置先: /etc/nginx/conf.d/m4laps_hardening.conf
#   （Ubuntu 既定の /etc/nginx/nginx.conf は http{} 内で
#     `include /etc/nginx/conf.d/*.conf;` しているため、ここに置けば http
#     コンテキストとして読み込まれる＝既存の sites-available を触らない）
#
# 効果 : 404 等のエラーページと Server レスポンスヘッダから nginx の
#        バージョン番号を隠す（例: "nginx/1.24.0 (Ubuntu)" → "nginx"）。
#        既知バージョンを狙う自動攻撃の手掛かりを減らす。
# 影響 : アプリ機能・表示・配信への影響なし。
# ロールバック : このファイルを削除して `sudo systemctl reload nginx`。
# ============================================================================

server_tokens off;
