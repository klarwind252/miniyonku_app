# ============================================================================
# SSE（Server-Sent Events / 即時push）用 nginx 設定スニペット
#   対象: 参加者向けHTMLのライブ更新push エンドポイント
#         /enter?api=events  （店舗版は /<slug>/enter?api=events）
#   目的: レスポンスバッファ・gzip・短いタイムアウトでSSEが途切れるのを防ぐ。
#   注意: これを入れなくてもアプリは壊れません（観覧側は10秒ポーリングに自動
#         フォールバック）。入れると「アドミン更新→観覧へほぼ即時反映」が有効化します。
# ============================================================================

# アプリ(uvicorn)の upstream。既存の proxy_pass 先に合わせて書き換えてください。
#   例) upstream m4app { server 127.0.0.1:8000; }
#   既存の server {} 内に、通常の location / より「前」に置くこと（優先一致）。

# --- SSEエンドポイント専用 location ---------------------------------------
# /enter は全店舗共通でアプリへ中継されている前提。api=events のときだけ
# バッファ無効化が効けばよいが、location は引数で分岐できないため /enter を
# まとめてストリーミング向け設定にする（通常の /enter?api=content 等にも無害）。
location /enter {
    proxy_pass              http://m4app;      # ← 既存の upstream 名/アドレスに合わせる
    proxy_http_version      1.1;               # SSEは HTTP/1.1（keep-alive）必須
    proxy_set_header        Host               $host;
    proxy_set_header        X-Real-IP          $remote_addr;
    proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto  $scheme;
    proxy_set_header        Connection         "";   # upstreamへは keep-alive

    # --- ここがSSEの肝 ---
    proxy_buffering         off;    # レスポンスをためずに即転送（最重要）
    proxy_cache             off;    # キャッシュ無効
    gzip                    off;    # 圧縮バッファで詰まらせない
    chunked_transfer_encoding on;
    proxy_read_timeout      3600s;  # アイドルでも切らない（1時間）。アプリ側が20秒毎にping
    proxy_send_timeout      3600s;
}

# スラッグ店舗（/demo1/enter など）も同様に中継している場合は、
# 既存の正規表現 location（例: location ~ ^/[a-z0-9-]+/(admin|view|enter|...) ）側にも
#   proxy_buffering off; gzip off; proxy_http_version 1.1; proxy_read_timeout 3600s;
# を追加してください。

# （任意）/api/pub-events を直接中継している構成なら、同じ設定の location /api/pub-events も追加。

# --- 反映手順 --------------------------------------------------------------
#   sudo nginx -t          # 構文チェック
#   sudo systemctl reload nginx
# 確認: 観覧ページを開いた状態でアドミンを更新 → ほぼ即時に反映されればOK。
#       反映が最大10秒かかる＝まだポーリング動作（バッファが効いている可能性）。
#   手動確認: curl -N 'https://<host>/enter?api=events'  （有効クッキーが必要。
#            つながると event: ready が返り、約20秒毎に ": ping" が流れる）
