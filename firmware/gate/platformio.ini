; firmware/gate/platformio.ini
; ============================================================================
;  M4LAPS セクター機（SQ0〜SQ5）。同一ファームを NODE_ID だけ変えて焼く。
;  32E(4MB)。common は ../common を include して共有する。
;  ⚠ ESPNOW_CHANNEL は運用チャンネル（当日調査・docs/19.6）。まずは1。
; ============================================================================
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps = Preferences
upload_speed = 921600
build_flags =
  -I../common
  -DESPNOW_CHANNEL=2            ; 状態B：起動時の初期ch（ブートストラップ）。以後GWのWiFi実chへ自動追従（docs/21・chfollow.h）

[env:sq0]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=0

[env:sq1]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=1

[env:sq2]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=2

; 予備：必要な台数ぶん（最大 SQ5=5）
[env:sq3]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=3
[env:sq4]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=4
[env:sq5]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=5
