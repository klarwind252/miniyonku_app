; firmware/gate/platformio.ini
; ============================================================================
;  M4LAPS セクター機（SQ0〜SQ5）。同一ファームを NODE_ID だけ変えて焼く。
;  32E(4MB)。common は ../common を include して共有する。
;  ⚠ ESPNOW_CHANNEL は運用チャンネル（当日調査・docs/19.6）。まずは1。
; ============================================================================
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps = Preferences
upload_speed = 921600
build_flags =
  -I../common
  -DESPNOW_CHANNEL=2            ; 状態B：起動時の初期ch（ブートストラップ）。以後GWのWiFi実chへ自動追従（docs/21・chfollow.h）

[env:sq0]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=0

[env:sq1]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=1

[env:sq2]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=2

; ★20261120 診断版（A/B遮光時間を [DIAG] でシリアル出力）。打刻・送信・タイム計算は通常版と同じ。
;   症状の出ている SE だけ一時的に焼き、確認が済んだら通常の env（sq0/sq1/sq2）で焼き戻す。
;   焼き方：pio run -e sq2_diag -t upload   → モニタ：pio device monitor
[env:sq0_diag]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=0 -DBEAM_DIAG=1
[env:sq1_diag]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=1 -DBEAM_DIAG=1
[env:sq2_diag]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=2 -DBEAM_DIAG=1

; 予備：必要な台数ぶん（最大 SQ5=5）
[env:sq3]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=3
[env:sq4]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=4
[env:sq5]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=5
