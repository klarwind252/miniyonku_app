; firmware/signal/platformio.ini
; ============================================================================
;  M4LAPS シグナル（SG10/SG11・XIAO ESP32C3）。赤3W→緑3W パワーLED。
;  2つの顔（docs/14 DA12）：
;    (1) GW連動：GWのCOMMAND(RED/GREEN)通りに光る（計測に使える）
;    (2) 単独 ：赤ボタンで即・緑を点灯（赤なし・ランダムなし・連動なし）
;  common は ../common を共有。
; ============================================================================
[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
  -I../common
  -DESPNOW_CHANNEL=2            ; K1：自宅ch=2に統一（⚠会場では再調査・全機再書込み）

[env:sg10]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=10

[env:sg11]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=11
