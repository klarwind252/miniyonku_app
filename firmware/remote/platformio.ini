; firmware/remote/platformio.ini
; ============================================================================
;  M4LAPS リモコン（RC8/RC9・XIAO ESP32C3）。赤=SIGNAL / 灰=RESET。
;  押下→ESP-NOWでGWへ COMMAND。common は ../common を共有。
; ============================================================================
[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps = Preferences
build_flags =
  -I../common
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESPNOW_CHANNEL=2            ; 状態B：起動時の初期ch（ブートストラップ）。以後GWのWiFi実chへ自動追従（docs/21・chfollow.h）
  -DUSE_DEEP_SLEEP=1           ; 20260904：バッテリー(LiPo)運用の標準として明示確定。0=従来の常時起動(USB給電)。
                               ;   ヘッダ既定(#ifndef=1)に依存せずビルドで固定（UB1前進・docs/03/33）。
                               ;   ⚠実装前提：LOWレベル起床のため各ボタン(GPIO3/4)に外付けプルアップ100kΩが必要（33章B-1）。

[env:rc8]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=8

[env:rc9]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=9
