; firmware/remote/platformio.ini
; ============================================================================
;  M4LAPS リモコン（RC8/RC9・XIAO ESP32C3）。赤=SIGNAL / 灰=RESET。
;  押下→ESP-NOWでGWへ COMMAND。common は ../common を共有。
; ============================================================================
[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps = Preferences
build_flags =
  -I../common
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESPNOW_CHANNEL=2            ; 状態B：起動時の初期ch（ブートストラップ）。以後GWのWiFi実chへ自動追従（docs/21・chfollow.h）
  -DUSE_DEEP_SLEEP=0           ; ★20261030：リモコンの反応改善のためディープスリープ解除＝常時起動版に変更。
                               ;   0=常時起動（loopでボタン監視・スリープ無し＝起床待ち/再同期のラグが消え即反応）。
                               ;   1=ディープスリープ（内蔵LiPo・待機~5µA。起床→ESP-NOW再init→ch再取得のラグで反応が鈍い）。
                               ;   ⚠ 常時起動は消費電流が大きい＝バッテリー運用では持たない。USB給電（モバイルバッテリー）前提。

[env:rc8]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=8

[env:rc9]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=9
