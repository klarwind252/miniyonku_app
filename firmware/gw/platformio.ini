; firmware/gw/platformio.ini
; ============================================================================
;  M4LAPS ゲートウェイ（GW6／予備GW7）。VE(8MB Flash + 8MB PSRAM)。
;  ⚠ VE受入確認でPSRAM=8388608を確認し、パーティション表を確定（docs/13[1]）。
;  common は ../common を include。secrets.h にWiFi/サーバURLを置く（.gitignore）。
; ============================================================================
[common]
platform = espressif32
board = esp-wrover-kit
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_8mb.csv
build_flags =
  -I../common
  -DESPNOW_CHANNEL=2            ; 状態B：起動時の初期ch（ブートストラップ／オフライン集合用）。WiFi接続後はスマホAPの実chを採用（gw_adopt_wifi_channel）
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DUSER_SETUP_LOADED=1
  -include src/User_Setup.h
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  bodmer/TFT_eSPI@^2.5.43

[env:gw]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=6

[env:gw7]
extends = common
build_flags = ${common.build_flags} -DNODE_ID=7