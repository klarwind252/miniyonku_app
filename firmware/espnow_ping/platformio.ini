; ============================================================================
;  espnow_ping — ESP-NOW 疎通確認（検証専用）
;  3枚に役割別で書き込む：gw / sq1 / sq2
;  すべて 32E(4MB)・チャンネル1固定
; ============================================================================
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:gw]
extends = common
build_flags = -DROLE_GW -DCH=1

[env:sq1]
extends = common
build_flags = -DROLE_SQ -DMY_NUM=1 -DCH=1

[env:sq2]
extends = common
build_flags = -DROLE_SQ -DMY_NUM=2 -DCH=1
